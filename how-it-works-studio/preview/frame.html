<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>frame</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
  import { drawFrame } from '/src/stage/reel/render.js';
  import { setPoses } from '/src/stage/reel/nao.js';
  import { setWorldAssets } from '/src/stage/reel/worlds.js';

  const q = new URLSearchParams(location.search);
  const reelPath = q.get('reel') || '/series/your-data-explained/reels/r03-why-the-ad-follows-you/';
  const frame = Number(q.get('frame') || 0);
  const guides = q.get('guides') === '1';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  async function loadPoses(base) {
    const manifest = await (await fetch(`${base}/poses.json`, { cache: 'no-store' })).json();
    const load = (src) =>
      new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`missing ${src}`));
        img.src = src;
      });
    const images = {};
    await Promise.all(manifest.poses.map(async (p) => { images[p.name] = await load(`${base}/${p.file}`); }));
    setPoses({ manifest, images });
    try {
      const shoe = await load(`${base}/../world/shoe.png`);
      setWorldAssets({ shoe });
    } catch { /* vector stand-in */ }
    return Object.keys(images).length;
  }

  (async () => {
    try {
      const n = await loadPoses('/assets/nao/poses');
      const res = await fetch(`${reelPath}reel.json`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`reel.json ${res.status}`);
      const reel = await res.json();
      drawFrame(ctx, reel, frame, { guides });
      window.__frame = { ok: true, sprites: n, shots: reel.shots.length, frame };
    } catch (err) {
      window.__frame = { ok: false, error: String(err && err.message || err) };
    }
    document.body.dataset.ready = '1';
  })();
</script>
</body>
</html>
